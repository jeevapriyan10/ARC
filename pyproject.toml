[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-cli"
version = "0.1.0"
description = "Autonomous Reasoning & Intervention CLI for Hackathon Projects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.scripts]
arc = "arc_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["arc_cli*"]
